
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#073b70">
<title>Thư mời | MêKông Vina</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="invite-page luxury-invite">

<header class="invite-header">
  <a class="brand" href="index.html">
    <img src="assets/logo-mekongvina.png"
         alt="MêKông Vina"
         class="brand-image">
    <span>
      <b>MÊKÔNG VINA</b>
      <small>CONNECTING SUCCESS</small>
    </span>
  </a>
  <button id="soundToggle" class="sound-toggle" hidden>
    ♫ <span>BẬT NHẠC</span>
  </button>
</header>

<main class="invite-main">
  <div class="luxury-decoration"></div>

  <div id="loading" class="loading-state">
    <span class="spinner"></span>
    Đang tải thư mời…
  </div>

  <section id="intro" class="invite-intro" hidden>
    <div class="intro-frame">
      <img src="assets/logo-mekongvina.png"
           alt="MêKông Vina" class="intro-logo">
      <p class="eyebrow">YOU ARE CORDIALLY INVITED</p>
      <div class="intro-monogram">✦</div>
      <h1 id="introTitle">Trân trọng kính mời</h1>
      <p id="introSubtitle"></p>
      <button id="openInvitation" class="btn btn-gold">
        MỞ THƯ MỜI <span>↗</span>
      </button>
      <small>CHẠM ĐỂ MỞ TRANG THƯ MỜI</small>
    </div>
  </section>

  <section id="reader" class="reader" hidden>
    <div class="book-frame">
      <div id="book" class="book"></div>
    </div>
    <div class="reader-controls">
      <button id="previous" aria-label="Trang trước">‹</button>
      <span id="pageCount">1 / 1</span>
      <button id="next" aria-label="Trang tiếp">›</button>
      <button id="fullscreen" aria-label="Toàn màn hình">⛶</button>
    </div>
    <p class="reader-tip">✦ Vuốt hoặc chạm mép trang để lật sách ✦</p>
  </section>

  <div id="errorBox" class="error-box" hidden></div>
</main>

<audio id="backgroundMusic" loop></audio>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="assets/viewer.js"></script>
</body>
</html>
